name: Build (NeoForge)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NeoForge jar
        run: |
          chmod +x ./gradlew
          ./gradlew :neoforge:build --stacktrace

      - name: Collect jar
        run: |
          mkdir -p dist
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          SRC="neoforge/build/libs/sable-neoforge-1.21.1-${VERSION}.jar"
          ls -la neoforge/build/libs
          cp "$SRC" "dist/sable-neoforge-1.21.1-${VERSION}-scalablelux.jar"
          echo "JAR=dist/sable-neoforge-1.21.1-${VERSION}-scalablelux.jar" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sable-neoforge-scalablelux
          path: dist/*.jar

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}-scalablelux"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Sable ${VERSION} + ScalableLux compat" \
              --notes "Sable ${VERSION} (NeoForge 1.21.1) with ScalableLux compatibility. Built from ${GITHUB_SHA}." \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$JAR" --clobber
